name: Release

# 打一个 v 开头的 tag（例如 v2.2.0）就自动构建并发布三件套。
# 也可以手动触发，填写一个已存在的 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，如 v2.2.0）'
        required: true

permissions:
  contents: write

# 同一个 ref 的发布串行跑，避免重复构建；正在跑的不要被打断（tag 发布必须完整出包）
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  portable:
    name: Portable (Windows)
    runs-on: windows-latest
    # beta 版本（tag 里带 beta）只出安卓 APK，跳过 Windows 绿色版和源码包
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'beta') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq 'workflow_dispatch') { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag -replace '^v', ''
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci

      # ffmpeg 二进制不大但每次都要从 gyan.dev 拉，缓存一下（key 变了会重新下）
      - name: Cache ffmpeg binary
        uses: actions/cache@v4
        with:
          path: .cache/toolchain/ffmpeg-lite
          key: ffmpeg-lite-${{ runner.os }}-v1

      - name: Fetch ffmpeg (essentials build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = '.cache\toolchain\ffmpeg-lite\ffmpeg.exe'
          if (Test-Path $dst) {
            Write-Host 'ffmpeg: 命中缓存，跳过下载'
          } else {
            New-Item -ItemType Directory -Force -Path .cache\toolchain\ffmpeg-lite | Out-Null
            curl.exe -L --retry 3 -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
            $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            Copy-Item $exe.FullName $dst -Force
            Remove-Item ffmpeg.zip -Force
            Remove-Item ffmpeg -Recurse -Force
          }
          & $dst -version | Select-Object -First 1

      - name: Build portable zip
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          ./build-portable.ps1 -Version $env:VERSION -NodeExe $node

      - name: Build source zip
        shell: pwsh
        run: |
          git archive --format=zip -o "dist/we-mpkg-src-$env:VERSION.zip" --prefix=we-mpkg/ HEAD

      - name: Release notes
        shell: pwsh
        run: |
          $lines = @(
            "we-mpkg $env:VERSION",
            "============",
            "由 GitHub Actions 自动构建（tag $env:TAG）。",
            "",
            "- 绿色版：解压 we-mpkg-portable-$env:VERSION.zip，双击 start.bat",
            "- 安卓：安装 we-mpkg-android-$env:VERSION.apk（arm64-v8a，覆盖安装保留登录凭据）",
            "- 源码：we-mpkg-src-$env:VERSION.zip",
            "",
            "构建提交：${{ github.sha }}"
          )
          $lines -join "`r`n" | Set-Content -Path "dist/发布说明-$env:VERSION.txt" -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: portable
          if-no-files-found: error
          path: |
            dist/we-mpkg-portable-*.zip
            dist/we-mpkg-src-*.zip
            dist/发布说明-*.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # NDK + build-tools + platform 加起来几百 MB，按版本号做 key 缓存
      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          # ubuntu runner 的 SDK 固定在 /usr/local/lib/android/sdk（env 上下文里取不到 ANDROID_HOME）
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            /usr/local/lib/android/sdk/platforms/android-36
          key: android-sdk-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-bt${{ env.ANDROID_BUILD_TOOLS }}-api36
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install NDK & build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-36"

      - name: Resolve version
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # 预编译原生库（libnode 等）来自 release 附件，按附件版本做 key
      - name: Cache prebuilt native libraries
        uses: actions/cache@v4
        with:
          path: .cache/native-prebuilt
          key: native-prebuilt-v1-${{ runner.os }}

      - name: Fetch prebuilt native libraries
        run: |
          mkdir -p .cache/native-prebuilt android/app/src/main/jniLibs
          if [ ! -s .cache/native-prebuilt/native.tar.gz ]; then
            curl -L --retry 3 -o .cache/native-prebuilt/native.tar.gz \
              https://github.com/MacroCN/we-mpkg/releases/download/android-node-prebuilt-v1/android-node-prebuilt-v1.tar.gz
          fi
          tar -xzf .cache/native-prebuilt/native.tar.gz -C android/app/src/main/jniLibs
          ls -lh android/app/src/main/jniLibs/arm64-v8a

      - name: Cache Android ffmpeg
        uses: actions/cache@v4
        with:
          path: .cache/toolchain/ffmpeg-android
          key: ffmpeg-android-9.0-${{ runner.os }}-9085507b

      - name: Fetch Android ffmpeg (LGPL + MediaCodec)
        run: |
          mkdir -p .cache/toolchain/ffmpeg-android android/app/src/main/jniLibs/arm64-v8a
          if [ ! -s .cache/toolchain/ffmpeg-android/ffmpeg ]; then
            curl -L --retry 3 -o .cache/toolchain/ffmpeg-android/ffmpeg \
              https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-9.0/bin/ffmpeg
          fi
          # 校验和始终跑：缓存里的文件被污染也能发现
          echo "9085507B0DC32643B4D6D084A7E7D3469EF17907A7BA15C22D3997ED09C932AA  .cache/toolchain/ffmpeg-android/ffmpeg" | sha256sum -c -
          chmod +x .cache/toolchain/ffmpeg-android/ffmpeg
          cp .cache/toolchain/ffmpeg-android/ffmpeg android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so

      - name: Sync JS project into assets
        run: |
          ASSETS=android/app/src/main/assets/nodejs-project
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -R bin src public package.json "$ASSETS"/
          # 纯 JS 下载引擎的依赖必须一起进 APK，否则手机上起不了 Steam 客户端
          cp -R node_modules "$ASSETS"/node_modules
          # Android asset merger 会把 foo.js.gz 当成 foo.js 的重复资源
          find "$ASSETS" -name '*.gz' -delete
          # Java 侧兜底逻辑要能 fallback，但正常路径只走 zip：先同步、再瘦身、最后打包
          node tools/prune-node-modules.js "$ASSETS/node_modules"
          node tools/make-assets-bundle.js "$ASSETS"
          ls -lh android/app/src/main/assets
          du -sh android/app/src/main/assets

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.8'

      - name: Gradle assembleRelease
        run: gradle -p android assembleRelease --no-daemon --console=plain

      - name: Align 16 KB & sign with release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p output dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "raw apk: $APK"
          node tools/zipalign16.js "$APK" output/_aligned.apk
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > output/release.keystore
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" sign --ks output/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out output/_signed.apk output/_aligned.apk
          cp output/_signed.apk "dist/we-mpkg-android-${VERSION}.apk"
          node tools/zipalign16.js "dist/we-mpkg-android-${VERSION}.apk" --check
          ls -lh "dist/we-mpkg-android-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: dist/we-mpkg-android-*.apk

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [portable, android]
    # beta 时 portable 会被跳过，只要没失败就继续发布
    # 注意：依赖 job 被 skip 时，默认会把依赖它的 job 一起 skip，所以必须带 always()
    if: ${{ always() && needs.android.result == 'success' && needs.portable.result != 'failure' && needs.portable.result != 'cancelled' }}
    steps:
      # 需要仓库里的 RELEASE-NOTES-<版本>.txt 作正文，所以要先 checkout（只取这一个文件也够，但没必要省）
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist

      - name: Resolve tag
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          case "$tag" in *beta*) echo "IS_BETA=1" >> "$GITHUB_ENV" ;; *) echo "IS_BETA=0" >> "$GITHUB_ENV" ;; esac

      - name: Prepare release body
        run: |
          set -e
          mkdir -p dist
          # 正文优先用仓库里的 RELEASE-NOTES-<版本>.txt（人工写好发版说明），没有就用 CI 生成的简短模板
          if [ -f "RELEASE-NOTES-${VERSION}.txt" ]; then
            cp "RELEASE-NOTES-${VERSION}.txt" "dist/RELEASE-NOTES-${VERSION}.txt"
          else
            for f in dist/发布说明-*.txt; do [ -e "$f" ] && cp "$f" "dist/RELEASE-NOTES-${VERSION}.txt" || true; done
          fi
          rm -f dist/发布说明-*.txt
          if [ -s "dist/RELEASE-NOTES-${VERSION}.txt" ]; then
            cat "dist/RELEASE-NOTES-${VERSION}.txt" > dist/release-body.md
          else
            printf 'we-mpkg %s\n\nGitHub Actions 自动构建（tag %s）。\n' "$VERSION" "$TAG" > dist/release-body.md
          fi
          {
            printf '\n## 下载\n\n'
            # beta 版本只构建安卓 APK，不列绿色版/源码包的下载项
            if [ "$IS_BETA" = "1" ]; then
              printf -- '- 安卓（测试版）：安装 `we-mpkg-android-%s.apk`（arm64-v8a，覆盖安装保留登录凭据）\n\n' "$VERSION"
            else
              printf -- '- 绿色版：解压 `we-mpkg-portable-%s.zip`，双击 `start.bat`\n' "$VERSION"
              printf -- '- 安卓：安装 `we-mpkg-android-%s.apk`（arm64-v8a，覆盖安装保留登录凭据）\n' "$VERSION"
              printf -- '- 源码：`we-mpkg-src-%s.zip`\n\n' "$VERSION"
            fi
            printf '构建提交：%s\n' "$GITHUB_SHA"
          } >> dist/release-body.md
          echo "正文前几行："; head -n 5 dist/release-body.md

      - uses: softprops/action-gh-release@v3
        if: ${{ env.IS_BETA == '0' }}
        with:
          tag_name: ${{ env.TAG }}
          name: we-mpkg ${{ env.VERSION }}
          # 带 - 的 tag（如 v2.4.0-beta.1）发布为预发布，避免 /releases/latest 把 beta 推给正式版用户
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ contains(env.TAG, '-') && 'false' || 'true' }}
          # 正文由上一步从 RELEASE-NOTES-<版本>.txt 拼出来，再附上下载说明
          body_path: dist/release-body.md
          files: |
            dist/we-mpkg-portable-*.zip
            dist/we-mpkg-android-*.apk
            dist/we-mpkg-src-*.zip
            dist/RELEASE-NOTES-*.txt
          fail_on_unmatched_files: true

      # beta 版本只构建安卓 APK：单独一步，避免 fail_on_unmatched_files 因为缺少绿色版/源码包报错
      - uses: softprops/action-gh-release@v3
        if: ${{ env.IS_BETA == '1' }}
        with:
          tag_name: ${{ env.TAG }}
          name: we-mpkg ${{ env.VERSION }}
          prerelease: true
          make_latest: 'false'
          body_path: dist/release-body.md
          files: |
            dist/we-mpkg-android-*.apk
            dist/RELEASE-NOTES-*.txt
          fail_on_unmatched_files: true
