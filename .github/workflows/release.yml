name: Release

# 打一个 v 开头的 tag（例如 v3.0.0）就自动构建安卓 APK 并按需要发布。
# 本分支只做移动端：不再产出 Windows 绿色版与源码包。
# 也可以手动触发，填写一个已存在的 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，如 v3.0.0）'
        required: true
      publish_beta:
        description: 'beta tag 是否也发布到 Releases（默认否：beta 只留 Actions 产物，测得更快）'
        type: boolean
        default: false

permissions:
  contents: write

# 同一个 ref 的发布串行跑，避免重复构建；正在跑的不要被打断（tag 发布必须完整出包）
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # NDK + build-tools + platform 加起来几百 MB，按版本号做 key 缓存
      - name: Cache Android SDK components
        uses: actions/cache@v5
        with:
          # ubuntu runner 的 SDK 固定在 /usr/local/lib/android/sdk（env 上下文里取不到 ANDROID_HOME）
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            /usr/local/lib/android/sdk/platforms/android-36
          # key 带 -v2：旧缓存里那份归档 tar 解不开（restore 报 tar exit 2），换 key 让下次构建重新上传一份
          # 不再用 restore-keys 前缀回退：前缀可能命中别的版本的不完整归档，恢复了也用不了
          key: android-sdk-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-bt${{ env.ANDROID_BUILD_TOOLS }}-api36-v2

      - name: Install NDK & build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-36"

      - name: Resolve version
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # 预编译原生库（libnode 等）来自 release 附件，按附件版本做 key
      - name: Cache prebuilt native libraries
        uses: actions/cache@v5
        with:
          path: .cache/native-prebuilt
          key: native-prebuilt-v1-${{ runner.os }}

      - name: Fetch prebuilt native libraries
        run: |
          mkdir -p .cache/native-prebuilt android/app/src/main/jniLibs
          if [ ! -s .cache/native-prebuilt/native.tar.gz ]; then
            curl -L --retry 3 -o .cache/native-prebuilt/native.tar.gz \
              https://github.com/MacroCN/we-mpkg-rs/releases/download/android-node-prebuilt-v1/android-node-prebuilt-v1.tar.gz
          fi
          tar -xzf .cache/native-prebuilt/native.tar.gz -C android/app/src/main/jniLibs
          ls -lh android/app/src/main/jniLibs/arm64-v8a

      # 只 strip libc++_shared.so。
      # libnode.so 的调试段是压缩存储（SHF_COMPRESSED），llvm-strip 会先解压再重写，
      # 实测 62.5MB -> 75.8MB（APK 反而涨 7MB），所以不能直接 strip；要瘦它只能重编译。
      - name: Strip prebuilt native libraries
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for lib in libc++_shared.so; do
            f="android/app/src/main/jniLibs/arm64-v8a/$lib"
            [ -f "$f" ] || continue
            before=$(stat -c%s "$f")
            "$TOOLCHAIN/llvm-strip" --strip-unneeded "$f"
            after=$(stat -c%s "$f")
            echo "$lib: $before -> $after bytes"
          done

      - name: Cache Android ffmpeg
        uses: actions/cache@v5
        with:
          path: .cache/toolchain/ffmpeg-android
          key: ffmpeg-android-9.0-${{ runner.os }}-9085507b

      - name: Fetch Android ffmpeg (LGPL + MediaCodec)
        run: |
          mkdir -p .cache/toolchain/ffmpeg-android android/app/src/main/jniLibs/arm64-v8a
          if [ ! -s .cache/toolchain/ffmpeg-android/ffmpeg ]; then
            curl -L --retry 3 -o .cache/toolchain/ffmpeg-android/ffmpeg \
              https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-9.0/bin/ffmpeg
          fi
          # 校验和始终跑：缓存里的文件被污染也能发现
          echo "9085507B0DC32643B4D6D084A7E7D3469EF17907A7BA15C22D3997ED09C932AA  .cache/toolchain/ffmpeg-android/ffmpeg" | sha256sum -c -
          chmod +x .cache/toolchain/ffmpeg-android/ffmpeg
          cp .cache/toolchain/ffmpeg-android/ffmpeg android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so

      - name: Build rust-tex (android arm64)
        run: |
          rustup target add aarch64-linux-android
          TOOLCHAIN="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android --manifest-path rust/tex-cli/Cargo.toml
          cp rust/tex-cli/target/aarch64-linux-android/release/rust-tex bin/rust-tex
          # 安卓禁止 exec 应用数据目录里的文件：可执行文件必须以 .so 形态进 nativeLibraryDir
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp rust/tex-cli/target/aarch64-linux-android/release/rust-tex android/app/src/main/jniLibs/arm64-v8a/librusttex.so
          file bin/rust-tex
          ls -lh bin/rust-tex

      - name: Sync JS project into assets
        run: |
          ASSETS=android/app/src/main/assets/nodejs-project
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -R bin src public package.json "$ASSETS"/
          # 纯 JS 下载引擎的依赖必须一起进 APK，否则手机上起不了 Steam 客户端
          cp -R node_modules "$ASSETS"/node_modules
          # Android asset merger 会把 foo.js.gz 当成 foo.js 的重复资源
          find "$ASSETS" -name '*.gz' -delete
          # Java 侧兜底逻辑要能 fallback，但正常路径只走 zip：先同步、再瘦身、最后打包
          node tools/prune-node-modules.js "$ASSETS/node_modules"
          node tools/make-assets-bundle.js "$ASSETS"
          ls -lh android/app/src/main/assets
          du -sh android/app/src/main/assets

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Gradle 8.14.8 与 AGP 8.13 匹配；CI 会提示版本过旧（Gradle 9 尚未与 AGP 8.13 兼容），升级 AGP 时再一起动
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.8'

      - name: Gradle assembleRelease
        run: gradle -p android assembleRelease --no-daemon --console=plain

      - name: Align 16 KB & sign with release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p output dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "raw apk: $APK"
          node tools/zipalign16.js "$APK" output/_aligned.apk
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > output/release.keystore
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" sign --ks output/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out output/_signed.apk output/_aligned.apk
          cp output/_signed.apk "dist/we-mpkg-android-${VERSION}.apk"
          node tools/zipalign16.js "dist/we-mpkg-android-${VERSION}.apk" --check
          ls -lh "dist/we-mpkg-android-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: dist/we-mpkg-android-*.apk

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [android]
    if: ${{ always() && needs.android.result == 'success' }}
    steps:
      # 需要仓库里的 release-notes/RELEASE-NOTES-<版本>.txt 作正文，所以要先 checkout
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist

      - name: Resolve tag
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          case "$tag" in *beta*) echo "IS_BETA=1" >> "$GITHUB_ENV" ;; *) echo "IS_BETA=0" >> "$GITHUB_ENV" ;; esac
          # beta 默认不建 Release：只走 Actions 的 android artifact，省掉发布环节的时间
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_beta }}" = "true" ]; then
            echo "PUBLISH_BETA=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_BETA=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare release body
        run: |
          set -e
          mkdir -p dist
          # 正文优先用仓库里的 release-notes/RELEASE-NOTES-<版本>.txt（人工写好发版说明），没有就用 CI 生成的简短模板
          if [ -f "release-notes/RELEASE-NOTES-${VERSION}.txt" ]; then
            cp "release-notes/RELEASE-NOTES-${VERSION}.txt" "dist/RELEASE-NOTES-${VERSION}.txt"
          else
            :
          fi
          rm -f dist/发布说明-*.txt
          if [ -s "dist/RELEASE-NOTES-${VERSION}.txt" ]; then
            cat "dist/RELEASE-NOTES-${VERSION}.txt" > dist/release-body.md
          else
            printf 'we-mpkg %s\n\nGitHub Actions 自动构建（tag %s）。\n' "$VERSION" "$TAG" > dist/release-body.md
          fi
          {
            printf '\n## 下载\n\n'
            if [ "$IS_BETA" = "1" ]; then
              printf -- '- 安卓（测试版）：安装 `we-mpkg-android-%s.apk`（arm64-v8a，覆盖安装保留登录凭据）\n\n' "$VERSION"
            else
              printf -- '- 安卓：安装 `we-mpkg-android-%s.apk`（arm64-v8a，覆盖安装保留登录凭据）\n\n' "$VERSION"
            fi
            printf '构建提交：%s\n' "$GITHUB_SHA"
          } >> dist/release-body.md
          echo "正文前几行："; head -n 5 dist/release-body.md

      - uses: softprops/action-gh-release@v3
        if: ${{ env.IS_BETA == '0' }}
        with:
          tag_name: ${{ env.TAG }}
          name: we-mpkg ${{ env.VERSION }}
          # 带 - 的 tag（如 v2.4.0-beta.1）发布为预发布，避免 /releases/latest 把 beta 推给正式版用户
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ contains(env.TAG, '-') && 'false' || 'true' }}
          # 正文由上一步从 RELEASE-NOTES-<版本>.txt 拼出来，再附上下载说明
          body_path: dist/release-body.md
          files: |
            dist/we-mpkg-android-*.apk
            dist/RELEASE-NOTES-*.txt
          fail_on_unmatched_files: true

      # beta 版本只构建安卓 APK：单独一步，避免 fail_on_unmatched_files 因附件不匹配报错
      # 默认不发布（PUBLISH_BETA=false），APK 留在本次 run 的 android artifact 里；需要发 Release 时手动触发并勾选 publish_beta
      - uses: softprops/action-gh-release@v3
        if: ${{ env.IS_BETA == '1' && env.PUBLISH_BETA == 'true' }}
        with:
          tag_name: ${{ env.TAG }}
          name: we-mpkg ${{ env.VERSION }}
          prerelease: true
          make_latest: 'false'
          body_path: dist/release-body.md
          files: |
            dist/we-mpkg-android-*.apk
            dist/RELEASE-NOTES-*.txt
          fail_on_unmatched_files: true
