name: Release

# 打一个 v 开头的 tag（例如 v2.2.0）就自动构建并发布三件套。
# 也可以手动触发，填写一个已存在的 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，如 v2.2.0）'
        required: true

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  portable:
    name: Portable (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq 'workflow_dispatch') { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag -replace '^v', ''
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Fetch ffmpeg (essentials build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .cache\toolchain\ffmpeg-lite | Out-Null
          curl.exe -L --retry 3 -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName .cache\toolchain\ffmpeg-lite\ffmpeg.exe -Force
          Remove-Item ffmpeg.zip -Force
          .cache\toolchain\ffmpeg-lite\ffmpeg.exe -version | Select-Object -First 1

      - name: Build portable zip
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          ./build-portable.ps1 -Version $env:VERSION -NodeExe $node

      - name: Build source zip
        shell: pwsh
        run: |
          git archive --format=zip -o "dist/we-mpkg-src-$env:VERSION.zip" --prefix=we-mpkg/ HEAD

      - name: Release notes
        shell: pwsh
        run: |
          $lines = @(
            "we-mpkg $env:VERSION",
            "============",
            "由 GitHub Actions 自动构建（tag $env:TAG）。",
            "",
            "- 绿色版：解压 we-mpkg-portable-$env:VERSION.zip，双击 start.bat",
            "- 安卓：安装 we-mpkg-android-$env:VERSION.apk（arm64-v8a，覆盖安装保留登录凭据）",
            "- 源码：we-mpkg-src-$env:VERSION.zip",
            "",
            "构建提交：${{ github.sha }}"
          )
          $lines -join "`r`n" | Set-Content -Path "dist/发布说明-$env:VERSION.txt" -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: portable
          if-no-files-found: error
          path: |
            dist/we-mpkg-portable-*.zip
            dist/we-mpkg-src-*.zip
            dist/发布说明-*.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK & build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-34"

      - name: Resolve version
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Fetch prebuilt native libraries
        run: |
          curl -L --retry 3 -o native.tar.gz \
            https://github.com/MacroCN/we-mpkg/releases/download/android-node-prebuilt-v1/android-node-prebuilt-v1.tar.gz
          mkdir -p android/app/src/main/jniLibs
          tar -xzf native.tar.gz -C android/app/src/main/jniLibs
          ls -lh android/app/src/main/jniLibs/arm64-v8a

      - name: Fetch Android ffmpeg (LGPL + MediaCodec)
        run: |
          mkdir -p .cache/toolchain/ffmpeg-android android/app/src/main/jniLibs/arm64-v8a
          curl -L --retry 3 -o .cache/toolchain/ffmpeg-android/ffmpeg \
            https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-9.0/bin/ffmpeg
          echo "9085507B0DC32643B4D6D084A7E7D3469EF17907A7BA15C22D3997ED09C932AA  .cache/toolchain/ffmpeg-android/ffmpeg" | sha256sum -c -
          chmod +x .cache/toolchain/ffmpeg-android/ffmpeg
          cp .cache/toolchain/ffmpeg-android/ffmpeg android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so

      - name: Sync JS project into assets
        run: |
          ASSETS=android/app/src/main/assets/nodejs-project
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -R bin src public package.json "$ASSETS"/
          # 纯 JS 下载引擎的依赖必须一起进 APK，否则手机上起不了 Steam 客户端
          cp -R node_modules "$ASSETS"/node_modules
          # Android asset merger 会把 foo.js.gz 当成 foo.js 的重复资源
          find "$ASSETS" -name '*.gz' -delete
          du -sh "$ASSETS"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gradle assembleRelease
        run: gradle -p android assembleRelease --no-daemon --console=plain

      - name: Align 16 KB & sign with release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p output dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "raw apk: $APK"
          node tools/zipalign16.js "$APK" output/_aligned.apk
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > output/release.keystore
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" sign --ks output/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out output/_signed.apk output/_aligned.apk
          cp output/_signed.apk "dist/we-mpkg-android-${VERSION}.apk"
          node tools/zipalign16.js "dist/we-mpkg-android-${VERSION}.apk" --check
          ls -lh "dist/we-mpkg-android-${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: dist/we-mpkg-android-*.apk

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [portable, android]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist

      - name: Resolve tag
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Rename notes
        run: |
          for f in dist/发布说明-*.txt; do [ -e "$f" ] && mv "$f" "dist/RELEASE-NOTES-${VERSION}.txt"; done || true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: we-mpkg ${{ env.VERSION }}
          # 带 - 的 tag（如 v2.4.0-beta.1）发布为预发布，避免 /releases/latest 把 beta 推给正式版用户
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ contains(env.TAG, '-') && 'false' || 'true' }}
          body: |
            we-mpkg ${{ env.VERSION }}

            GitHub Actions 自动构建，提交 ${{ github.sha }}。
            - 绿色版：解压 `we-mpkg-portable-${{ env.VERSION }}.zip`，双击 `start.bat`
            - 安卓：安装 `we-mpkg-android-${{ env.VERSION }}.apk`（arm64-v8a，覆盖安装保留凭据）
            - 源码：`we-mpkg-src-${{ env.VERSION }}.zip`
          files: |
            dist/we-mpkg-portable-*.zip
            dist/we-mpkg-android-*.apk
            dist/we-mpkg-src-*.zip
            dist/RELEASE-NOTES-*.txt
          fail_on_unmatched_files: true
