plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wempkg.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wempkg.app"
        minSdk 24
        targetSdk 34
        versionCode 35
        versionName "2.4.4"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // .so 以未压缩方式存入 APK，并按 16 KB 对齐（见 build-apk.ps1 里的 zipalign -P 16）
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    // assets 里的 .gz 会被 aapt 过滤掉，nodejs-project 里要保持原样
    // zip 也不要二次压缩：nodejs-project.zip 本身已经是压缩包，解包时直接读省一次 inflate
    androidResources {
        noCompress += ['gz', 'mpkg', 'pkg', 'zip']
    }
}






