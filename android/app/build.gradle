plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wempkg.app'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.wempkg.rs.app"
        minSdk 24
        targetSdk 36
        versionCode 89
        versionName "3.0.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // .so 以未压缩方式存入 APK，并按 16 KB 对齐（见 build-apk.ps1 里的 zipalign -P 16）
    packaging {
        jniLibs {
            // 压缩存放 .so：不压缩会让 APK 从 ~45MB 涨到 ~84MB（libnode 就 62MB）。
            // 之前在 AndroidManifest 里写 extractNativeLibs=true 也是这个效果，
            // 但 AGP 8.13 会警告不该写在清单里，改成这里显式声明。
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    // assets 里的 .gz 会被 aapt 过滤掉，nodejs-project 里要保持原样
    // zip 也不要二次压缩：nodejs-project.zip 本身已经是压缩包，解包时直接读省一次 inflate
    androidResources {
        noCompress += ['gz', 'mpkg', 'pkg', 'zip']
    }
}






