<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下载中心 · we-mpkg</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="downloads.css" />
</head>
<body class="dl-page">
  <header class="dl-head">
    <div class="dl-head-left">
      <h1>下载中心</h1>
      <span class="dl-sub">独立进程运行 · 关闭页面不会中断任务</span>
    </div>
    <div class="dl-head-right">
      <span id="dl-stat" class="dl-stat">…</span>
      <button id="dl-clear" class="ghost" title="清掉已完成/失败的历史">清空历史</button>
      <a id="mainLink" class="ghost" href="/" target="_blank" rel="noreferrer">打开主界面</a>
    </div>
  </header>

  <main class="dl-main">
    <div id="dl-empty" class="dl-empty">还没有下载任务。在主界面详情页点「下载并打包为 MPKG」就会出现在这里。</div>
    <div id="dl-confirm" class="dl-confirm">
      <span id="dl-confirm-text"></span>
      <button id="dl-confirm-yes" class="ghost danger">清空</button>
      <button id="dl-confirm-no" class="ghost">取消</button>
    </div>
    <div id="dl-list" class="dl-list"></div>

    <section class="dl-outputs">
      <div class="dl-outputs-head">
        <h2>成品目录</h2>
        <span id="dl-out-dir" class="dl-sub"></span>
      </div>
      <div id="dl-out-list" class="dl-out-list"></div>
    </section>
  </main>

  <script src="joblib.js"></script>
  <script src="downloads.js"></script>
</body>
</html>
